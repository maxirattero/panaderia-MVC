<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#855330">
    <title>Sin conexión | Masa Viva</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #e7ddd6; color: #2f2018; font-family: system-ui, sans-serif; }
        main { max-width: 430px; padding: 32px; text-align: center; background: #fffaf6; border-radius: 20px; box-shadow: 0 8px 30px rgba(47, 32, 24, .14); }
        img { width: 80px; height: 80px; border-radius: 18px; }
        h1 { margin: 22px 0 10px; font-size: 1.5rem; }
        p { line-height: 1.5; color: #6c5143; }
        button { margin-top: 12px; border: 0; border-radius: 10px; padding: 12px 18px; background: #855330; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/img/logo-masaviva.png" alt="Masa Viva">
        <h1>Sin conexión</h1>
        <p>Necesitás internet para consultar y actualizar los datos de Masa Viva. Cuando vuelva la conexión, podés reintentar.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
